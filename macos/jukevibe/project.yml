name: JukeVibeMac
options:
  bundleIdPrefix: com.juke
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2WMS6785YD
targets:
  JukeVibeMac:
    type: application
    platform: macOS
    sources:
      - path: JukeVibeMac
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juke.vibe.mac
        PRODUCT_NAME: Juke Vibe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: JukeVibeMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: JukeVibeMac/JukeVibeMac.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
  JukeVibeMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: JukeVibeMacTests
    dependencies:
      - target: JukeVibeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juke.vibe.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Juke Vibe.app/Contents/MacOS/Juke Vibe"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  JukeVibeMac:
    build:
      targets:
        JukeVibeMac: all
        JukeVibeMacTests: [test]
    test:
      targets:
        - JukeVibeMacTests
