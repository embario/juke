name: JukeVibe
options:
  bundleIdPrefix: com.juke
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2WMS6785YD
targets:
  JukeVibe:
    type: application
    platform: iOS
    sources:
      - path: JukeVibe
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juke.vibe
        PRODUCT_NAME: Juke Vibe
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: JukeVibe/Info.plist
        CODE_SIGN_ENTITLEMENTS: JukeVibe/JukeVibe.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
  JukeVibeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JukeVibeTests
    dependencies:
      - target: JukeVibe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juke.vibe.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Juke Vibe.app/Juke Vibe"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  JukeVibe:
    build:
      targets:
        JukeVibe: all
        JukeVibeTests: [test]
    test:
      targets:
        - JukeVibeTests
